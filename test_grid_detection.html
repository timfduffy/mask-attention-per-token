<!DOCTYPE html>
<html>
<head>
    <title>Test Grid Detection</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .result { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <h1>Grid Detection Test</h1>
    
    <div id="results"></div>
    
    <script>
        function findBestGrid(numTokens) {
            const sqrtExact = Math.sqrt(numTokens);
            
            // Perfect square? Use it
            if (Number.isInteger(sqrtExact)) {
                return { width: sqrtExact, height: sqrtExact };
            }
            
            // Find all factor pairs
            const factors = [];
            for (let i = 1; i <= Math.sqrt(numTokens) + 1; i++) {
                if (numTokens % i === 0) {
                    const j = Math.floor(numTokens / i);
                    // Store as (width, height) with width >= height for landscape orientation
                    factors.push({ width: j, height: i });
                }
            }
            
            // Prefer factors closest to square (minimal difference between width and height)
            const best = factors.reduce((prev, curr) => {
                const prevDiff = Math.abs(prev.width - prev.height);
                const currDiff = Math.abs(curr.width - curr.height);
                return currDiff < prevDiff ? curr : prev;
            });
            
            return best;
        }
        
        const testCases = [
            { tokens: 576, expected: "24×24", description: "orb_looking_at (perfect square)" },
            { tokens: 528, expected: "24×22", description: "eras_text (rectangular)" },
            { tokens: 256, expected: "16×16", description: "perfect square" },
            { tokens: 100, expected: "10×10", description: "perfect square" },
            { tokens: 120, expected: "12×10", description: "rectangular, close to square" },
        ];
        
        let html = '';
        
        testCases.forEach(test => {
            const result = findBestGrid(test.tokens);
            const resultStr = `${result.width}×${result.height}`;
            const match = resultStr === test.expected;
            const status = match ? '✓' : '✗';
            const color = match ? 'green' : 'red';
            
            html += `<div class="test">`;
            html += `<div>${test.description}</div>`;
            html += `<div>Tokens: ${test.tokens}</div>`;
            html += `<div>Expected: ${test.expected}</div>`;
            html += `<div class="result" style="color: ${color}">${status} Got: ${resultStr}</div>`;
            
            // Show all possible grids
            const allFactors = [];
            for (let i = 1; i <= Math.sqrt(test.tokens) + 1; i++) {
                if (test.tokens % i === 0) {
                    allFactors.push(`${Math.floor(test.tokens/i)}×${i}`);
                }
            }
            html += `<div style="font-size: 0.9em; color: #666;">All options: ${allFactors.join(', ')}</div>`;
            html += `</div>`;
        });
        
        document.getElementById('results').innerHTML = html;
    </script>
</body>
</html>
